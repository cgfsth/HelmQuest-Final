<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">READ LATITUDE AND LONGITUDE</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">Example reference P: read latitude at the side and longitude along the bottom.</text><line x1="85" y1="160" x2="85" y2="460" stroke="#325b70" stroke-width="4" /><line x1="85" y1="160" x2="465" y2="160" stroke="#325b70" stroke-width="4" /><text x="58" y="166" font-family="Arial,sans-serif" font-size="17" fill="#e7f4fb">7.14</text><text x="65" y="488" font-family="Arial,sans-serif" font-size="16" fill="#e7f4fb">125.72</text><line x1="180" y1="160" x2="180" y2="460" stroke="#325b70" stroke-width="4" /><line x1="85" y1="235" x2="465" y2="235" stroke="#325b70" stroke-width="4" /><text x="58" y="241" font-family="Arial,sans-serif" font-size="17" fill="#e7f4fb">7.12</text><text x="160" y="488" font-family="Arial,sans-serif" font-size="16" fill="#e7f4fb">125.76</text><line x1="275" y1="160" x2="275" y2="460" stroke="#325b70" stroke-width="4" /><line x1="85" y1="310" x2="465" y2="310" stroke="#325b70" stroke-width="4" /><text x="58" y="316" font-family="Arial,sans-serif" font-size="17" fill="#e7f4fb">7.10</text><text x="255" y="488" font-family="Arial,sans-serif" font-size="16" fill="#e7f4fb">125.80</text><line x1="370" y1="160" x2="370" y2="460" stroke="#325b70" stroke-width="4" /><line x1="85" y1="385" x2="465" y2="385" stroke="#325b70" stroke-width="4" /><text x="58" y="391" font-family="Arial,sans-serif" font-size="17" fill="#e7f4fb">7.08</text><text x="350" y="488" font-family="Arial,sans-serif" font-size="16" fill="#e7f4fb">125.84</text><line x1="465" y1="160" x2="465" y2="460" stroke="#325b70" stroke-width="4" /><line x1="85" y1="460" x2="465" y2="460" stroke="#325b70" stroke-width="4" /><text x="58" y="466" font-family="Arial,sans-serif" font-size="17" fill="#e7f4fb">7.06</text><text x="445" y="488" font-family="Arial,sans-serif" font-size="16" fill="#e7f4fb">125.88</text><circle cx="275" cy="310" r="9" fill="#ffcf77"/><text x="290" y="303" font-family="Arial,sans-serif" font-size="28" fill="#ffcf77">P</text><line x1="85" y1="310" x2="275" y2="310" stroke="#ffcf77" stroke-width="4" stroke-dasharray="9 7"/><line x1="275" y1="310" x2="275" y2="460" stroke="#ffcf77" stroke-width="4" stroke-dasharray="9 7"/><rect x="530" y="165" width="385" height="275" rx="16" fill="#14364b" stroke="#39627b"/><text x="550" y="205" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">POSITION P</text><text x="550" y="248" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Latitude: 7.10 degrees N</text><text x="550" y="282" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Longitude: 125.80 degrees E</text><text x="550" y="316" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Both coordinates are needed.</text><text x="550" y="350" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">N/S locate latitude.</text><text x="550" y="384" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">E/W locate longitude.</text><line x1="30" y1="532" x2="930" y2="532" stroke="#2a4c61" stroke-width="4" /><text x="32" y="561" font-family="Arial,sans-serif" font-size="17" fill="#9abed2">HELMQUEST  /  LESSON REFERENCE  /  TRAINING SCHEMATIC</text></svg>