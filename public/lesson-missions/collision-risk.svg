<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">RECOGNIZE COLLISION RISK</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">Little change in bearing while range decreases is a warning of collision risk.</text><g transform="translate(200,405) rotate(0)"><path d="M0 -40L19 -5L15 37L-15 37L-19 -5Z" fill="#56bde8" stroke="#effaff" stroke-width="2"/><rect x="-9" y="0" width="18" height="21" fill="#203d53"/></g><g transform="translate(430,280) rotate(0)"><path d="M0 -40L19 -5L15 37L-15 37L-19 -5Z" fill="#ffce83" stroke="#effaff" stroke-width="2"/><rect x="-9" y="0" width="18" height="21" fill="#203d53"/></g><g transform="translate(640,165) rotate(0)"><path d="M0 -40L19 -5L15 37L-15 37L-19 -5Z" fill="#ffce83" stroke="#effaff" stroke-width="2"/><rect x="-9" y="0" width="18" height="21" fill="#203d53"/></g><line x1="200" y1="370" x2="650" y2="150" stroke="#ffce83" stroke-width="4" stroke-dasharray="10 8"/><text x="90" y="485" font-family="Arial,sans-serif" font-size="22" fill="#e7f4fb">Own vessel</text><text x="360" y="330" font-family="Arial,sans-serif" font-size="21" fill="#ffce83">Later: closer</text><text x="635" y="220" font-family="Arial,sans-serif" font-size="21" fill="#ffce83">Earlier: farther</text><rect x="590" y="350" width="330" height="145" rx="16" fill="#14364b" stroke="#39627b"/><text x="610" y="390" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">TAKE EARLY ACTION</text><text x="610" y="433" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Do not wait for contact.</text><text x="610"