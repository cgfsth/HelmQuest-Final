<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">THE SCIENCE OF NAVIGATION</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">Observation + measurement + calculation + verification</text><rect x="40" y="160" width="420" height="305" rx="16" fill="#14364b" stroke="#39627b"/><text x="60" y="200" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">MEASURE</text><text x="60" y="243" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Position: latitude / longitude</text><text x="60" y="277" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Direction: heading / bearing</text><text x="60" y="311" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Speed and elapsed time</text><text x="60" y="345" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Instrument observations</text><rect x="495" y="160" width="420" height="305" rx="16" fill="#14364b" stroke="#39627b"/><text x="515" y="200" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">VERIFY</text><text x="515" y="243" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Compare independent sources</text><text x="515" y="277" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Use the chart and its datum</text><text x="515" y="311" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Account for uncertainty</text><text x="515" y="345" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Check the voyage as it develops</text><line x1="30" y1="532" x2="930" y2="532" stroke="#2a4c61" st