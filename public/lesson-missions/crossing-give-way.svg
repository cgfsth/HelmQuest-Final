<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">CROSSING: OWN VESSEL GIVES WAY</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">Two ordinary power-driven vessels in sight; other vessel on own starboard side.</text><g transform="translate(350,440) rotate(0)"><path d="M0 -40L19 -5L15 37L-15 37L-19 -5Z" fill="#56bde8" stroke="#effaff" stroke-width="2"/><rect x="-9" y="0" width="18" height="21" fill="#203d53"/></g><g transform="translate(720,230) rotate(-90)"><path d="M0 -40L19 -5L15 37L-15 37L-19 -5Z" fill="#ffc982" stroke="#effaff" stroke-width="2"/><rect x="-9" y="0" width="18" height="21" fill="#203d53"/></g><line x1="700" y1="230" x2="440" y2="230" stroke="#48c9ef" stroke-width="4" marker-end="url(#arrow)"/><path d="M350 400Q350 350 480 350L790 350L790 170" stroke="#64dbef" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="200" y="505" font-family="Arial,sans-serif" font-size="23" fill="#e7f4fb">Own vessel: give way</text><text x="590" y="155" font-family="Arial,sans-serif" font-size="23" fill="#ffcf8a">Other vessel: stand on</text><text x="540" y="435" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Illustrated avoiding route</text><text x="540" y="470" font-family="Arial,sans-serif" font-size="20" fill="#e7f4fb">Pass astern; do not cross ahead.</text><line x1="30" y1="532" x2="930" y2="532" stroke="#2a4c61" stroke-width="4" /><text x="32" y="561" font-family="Arial,sans-serif" font-size="17" fill="#9abed2">HELMQUEST  /  LESSON REFERENCE  /  TRAINING SCHEMATIC<