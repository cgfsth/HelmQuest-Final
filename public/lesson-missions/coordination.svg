<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">CONTROL - OBSERVE - CORRECT</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">Practise coordinated handling using the helm, compass and vessel response.</text><rect x="40" y="155" width="270" height="310" rx="16" fill="#14364b" stroke="#39627b"/><text x="60" y="195" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">CONTROL</text><text x="60" y="238" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Apply a small input</text><text x="60" y="272" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Avoid abrupt changes</text><text x="60" y="306" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Allow a response</text><rect x="345" y="155" width="270" height="310" rx="16" fill="#14364b" stroke="#39627b"/><text x="365" y="195" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">OBSERVE</text><text x="365" y="238" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Watch the heading</text><text x="365" y="272" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Check vessel motion</text><text x="365" y="306" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Monitor clearance</text><rect x="650" y="155" width="270" height="310" rx="16" fill="#14364b" stroke="#39627b"/><text x="670" y="195" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">CORRECT</text><text x="670" y="238" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Adjust gradually</text><text x="670" y="272" font-f