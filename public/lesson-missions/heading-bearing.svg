<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">HEADING AND BEARING</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">A heading describes the bow direction; a bearing describes a direction to a target.</text><g transform="translate(300,380) rotate(0)"><path d="M0 -40L19 -5L15 37L-15 37L-19 -5Z" fill="#56bde8" stroke="#effaff" stroke-width="2"/><rect x="-9" y="0" width="18" height="21" fill="#203d53"/></g><line x1="300" y1="330" x2="300" y2="165" stroke="#48c9ef" stroke-width="4" marker-end="url(#arrow)"/><line x1="325" y1="355" x2="550" y2="130" stroke="#48c9ef" stroke-width="4" marker-end="url(#arrow)"/><circle cx="550" cy="130" r="14" fill="#ffcf77"/><text x="190" y="148" font-family="Arial,sans-serif" font-size="25" fill="#e7f4fb">HEADING 000 deg</text><text x="530" y="255" font-family="Arial,sans-serif" font-size="25" fill="#ffcf77">BEARING 045 deg</text><text x="575" y="150" font-family="Arial,sans-serif" font-size="23" fill="#e7f4fb">Target</text><rect x="530" y="330" width="385" height="150" rx="16" fill="#14364b" stroke="#39627b"/><text x="550" y="370" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">REFERENCE MATTERS</text><text x="550" y="413" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">State true or magnetic.</text><text x="550" y="447" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Use a consistent reference.</text><line x1="30" y1="532" x2="930" y2="532" stroke="#2a4c61" stroke-width="4" /><text x="32" y="561" font-family="Arial,sans-serif" font-size="17" fil