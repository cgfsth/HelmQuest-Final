<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">MERCATOR AND ROUTE PLOTTING</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">A rhumb line keeps a constant bearing on the chosen north reference.</text><rect x="45" y="155" width="410" height="310" rx="16" fill="#14364b" stroke="#39627b"/><text x="65" y="195" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">MERCATOR GRID</text><text x="65" y="238" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Meridians and parallels</text><text x="65" y="272" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">meet at right angles.</text><text x="65" y="306" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">A rhumb-line route plots</text><text x="65" y="340" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">as a straight line.</text><line x1="530" y1="185" x2="530" y2="460" stroke="#47748a" stroke-width="4" /><line x1="650" y1="185" x2="650" y2="460" stroke="#47748a" stroke-width="4" /><line x1="770" y1="185" x2="770" y2="460" stroke="#47748a" stroke-width="4" /><line x1="890" y1="185" x2="890" y2="460" stroke="#47748a" stroke-width="4" /><line x1="530" y1="210" x2="890" y2="210" stroke="#47748a" stroke-width="4" /><line x1="530" y1="335" x2="890" y2="335" stroke="#47748a" stroke-width="4" /><line x1="530" y1="460" x2="890" y2="460" stroke="#47748a" stroke-width="4" /><line x1="550" y1="435" x2="865" y2="235" stroke="#48c9ef" stroke-width="4" marker-end="url(#arrow)"/><text x="650" y="490" font-family="Arial,sans-serif" font-size="20" fill="#e7f4fb">Straight rhumb-line plot</text><line x1="30" y1="532" x2="930" y2="532" stroke="#2a4c61" stroke-width="4" /><text x="32" y="561" font-family="Arial,sans-serif" font-size="17" fill="#9abed2">HELMQUEST  /  LESSON REFERENCE  /  TRAINING SCHEMATIC</text></svg>