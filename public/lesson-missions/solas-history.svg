<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62d6f3"/></marker></defs><rect width="960" height="580" rx="20" fill="#0b2032"/><rect x="0" y="0" width="960" height="112" rx="20" fill="#143a51"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="31" fill="#e7f4fb">SOLAS 1974: CONVENTION AND AMENDMENTS</text><text x="32" y="85" font-family="Arial,sans-serif" font-size="20" fill="#a9d9ec">Distinguish the adoption date, entry into force and later amendments.</text><rect x="40" y="165" width="420" height="290" rx="16" fill="#14364b" stroke="#39627b"/><text x="60" y="205" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">1 NOVEMBER 1974</text><text x="60" y="248" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Convention adopted.</text><text x="60" y="282" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Rules concern ship safety.</text><text x="60" y="316" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">The treaty was subsequently</text><text x="60" y="350" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">updated through amendments.</text><rect x="495" y="165" width="420" height="290" rx="16" fill="#14364b" stroke="#39627b"/><text x="515" y="205" font-family="Arial,sans-serif" font-size="26" fill="#7ce0ff">25 MAY 1980</text><text x="515" y="248" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">Convention entered into force.</text><text x="515" y="282" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">SOLAS 1974, as amended,</text><text x="515" y="316" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">is the reference used for</text><text x="515" y="350" font-family="Arial,sans-serif" font-size="21" fill="#e7f4fb">modern SOLAS requirements.</text><line x1="30" y1="532" x2="930" y2="532" stroke="#2a4c61" stroke-width="4" /><text x="32" y="561" font-family="Arial,sans-serif" font-size="17" fill="#9abed2">HELMQUEST  /  LESSON REFERENCE  /  TRAINING SCHEMATIC</text></svg>